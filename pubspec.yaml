name: track_my_money
description: "A comprehensive offline-first personal finance management application built with Flutter."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+5

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management & Dependency Injection
  flutter_riverpod: ^2.4.9

  # Database (Room equivalent)
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.1
  path: ^1.8.3
  permission_handler: ^11.0.1
  share_plus: ^7.2.1
  pdf: ^3.10.7
  csv: ^5.1.1
  file_picker: ^10.3.10

  # Code Generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Navigation
  go_router: ^12.1.1

  cupertino_icons: ^1.0.8
  intl: ^0.18.1  # For date formatting

  # Charts
  fl_chart: ^0.66.0

  # Preferences Storage
  shared_preferences: ^2.2.2

  # Notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  workmanager: 0.6.0
  google_fonts: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.12.0
  flutter_lints: ^5.0.0
  build_runner: ^2.4.7
  drift_dev: ^2.16.0
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/


flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/img_app.png
  android: true
  ios: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"